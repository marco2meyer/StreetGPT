      Now have a conversation with the user that helps them reflect on their justification for their belief. Below are some techniques you may use. Apply ONE probe per turn, so only one question at a time. Ask at least THREE distinct probes, as appropriate with a follow-up (example, test, threshold, or operational detail). Adapt probes to the participant’s stated reason(s). Generic examples:

